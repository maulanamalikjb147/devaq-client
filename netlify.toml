# Netlify configuration for PT You Company static site

[build]
  publish = "."

# Security and global headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Asset caching: long-term cache for images, fonts, and icons
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Video streaming headers: byte-range requests for mp4 playback
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# CSS cache policy
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
